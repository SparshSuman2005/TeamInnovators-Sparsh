<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Campus Lost & Found</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        background: #0f1115;
        color: #e8e8e8;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 4px;
      }
      p.sub {
        color: #9a9a9a;
        margin-top: 0;
        margin-bottom: 30px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .tab {
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        background: #1b1e26;
        border: 1px solid #2a2d38;
      }
      .tab.active {
        background: #3b5bfd;
        border-color: #3b5bfd;
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 12px;
        border-radius: 8px;
        border: 1px solid #2a2d38;
        background: #1b1e26;
        color: #e8e8e8;
      }
      textarea {
        min-height: 80px;
      }
      button {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: #3b5bfd;
        color: white;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background: #2c47d6;
      }
      .card {
        background: #1b1e26;
        border: 1px solid #2a2d38;
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 10px;
      }
      .card h3 {
        margin: 0 0 4px 0;
        font-size: 15px;
      }
      .card p {
        margin: 2px 0;
        font-size: 13px;
        color: #b5b5b5;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 20px;
        margin-right: 6px;
      }
      .badge.lost {
        background: #4a2020;
        color: #ff8a8a;
      }
      .badge.found {
        background: #1f3a24;
        color: #7ee08a;
      }
      .score {
        color: #ffd479;
        font-size: 12px;
      }
      #status {
        margin-top: 8px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>🔎 Campus Lost & Found</h1>
    <p class="sub">Report an item, or check the list below.</p>

    <div class="tabs">
      <div class="tab active" onclick="showTab('lost')">Report Lost</div>
      <div class="tab" onclick="showTab('found')">Report Found</div>
      <div class="tab" onclick="showTab('browse')">Browse All</div>
    </div>

    <div id="lost" class="panel active">
      <input id="lost-title" placeholder="Item title (e.g. Black wallet)" />
      <textarea
        id="lost-desc"
        placeholder="Description (where lost, color, brand, etc.)"
      ></textarea>
      <input id="lost-location" placeholder="Location (optional)" />
      <input id="lost-contact" placeholder="Your contact (phone/email)" />
      <button onclick="submitItem('lost')">Submit Lost Item</button>
    </div>

    <div id="found" class="panel">
      <input id="found-title" placeholder="Item title (e.g. Wallet found)" />
      <textarea
        id="found-desc"
        placeholder="Description (where found, color, brand, etc.)"
      ></textarea>
      <input id="found-location" placeholder="Location (optional)" />
      <input id="found-contact" placeholder="Your contact (phone/email)" />
      <button onclick="submitItem('found')">Submit Found Item</button>
    </div>

    <div id="browse" class="panel">
      <button onclick="loadItems()">Refresh List</button>
      <div id="items-list" style="margin-top: 16px"></div>
    </div>

    <div id="status"></div>

    <script>
      const API = "http://127.0.0.1:8000";

      function showTab(name) {
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".panel")
          .forEach((p) => p.classList.remove("active"));
        document
          .querySelector(`.tab[onclick="showTab('${name}')"]`)
          .classList.add("active");
        document.getElementById(name).classList.add("active");
        if (name === "browse") loadItems();
      }

      async function submitItem(type) {
        const title = document.getElementById(`${type}-title`).value;
        const description = document.getElementById(`${type}-desc`).value;
        const location = document.getElementById(`${type}-location`).value;
        const contact = document.getElementById(`${type}-contact`).value;

        if (!title || !description || !contact) {
          setStatus("Fill title, description, and contact.", true);
          return;
        }

        const res = await fetch(`${API}/lost-found/report-${type}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, description, location, contact }),
        });

        if (res.ok) {
          const data = await res.json();
          setStatus(`Submitted! Item #${data.id}. Checking matches...`);
          document.getElementById(`${type}-title`).value = "";
          document.getElementById(`${type}-desc`).value = "";
          document.getElementById(`${type}-location`).value = "";
          document.getElementById(`${type}-contact`).value = "";
          checkMatches(data.id);
        } else {
          setStatus("Something went wrong. Check server terminal.", true);
        }
      }

      async function checkMatches(itemId) {
        const res = await fetch(`${API}/lost-found/matches/${itemId}`);
        const matches = await res.json();
        if (matches.length > 0) {
          setStatus(
            `✅ ${matches.length} possible match(es) found! Check Browse tab.`,
          );
        } else {
          setStatus("Submitted. No matches yet — we'll keep checking.");
        }
      }

      async function loadItems() {
        const res = await fetch(`${API}/lost-found/items`);
        const items = await res.json();
        const container = document.getElementById("items-list");
        container.innerHTML = "";

        if (items.length === 0) {
          container.innerHTML = '<p style="color:#888;">No items yet.</p>';
          return;
        }

        items.forEach((item) => {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
      <span class="badge ${item.type}">${item.type.toUpperCase()}</span>
      <h3>${item.title}</h3>
      <p>${item.description}</p>
      <p>📍 ${item.location || "not specified"} &nbsp; 📞 ${item.contact}</p>
      <p>Status: ${item.status}</p>
    `;
          container.appendChild(div);
        });
      }

      function setStatus(msg, isError = false) {
        const el = document.getElementById("status");
        el.textContent = msg;
        el.style.color = isError ? "#ff8a8a" : "#7ee08a";
      }
    </script>
  </body>
</html>
