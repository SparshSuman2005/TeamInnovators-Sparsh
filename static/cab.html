<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Cab - Campus Help</title>
<style>
  :root{
    --ink:#1c1f26;
    --muted:#6b7280;
    --line:#eceae4;
    --paper:#ffffff;
    --panel:#faf9f6;
    --orange:#ff7a1a;
    --orange-soft:#fff1e6;
    --wa-green:#25d366;
    --wa-green-dark:#1da851;
    --primary:#3457d5;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:Inter, "Segoe UI", system-ui, sans-serif;
    min-height:100vh;
  }
  .topbar{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 28px;
    background:rgba(255,255,255,0.9);
    border-bottom:1px solid #dbe3ee;
    backdrop-filter:blur(14px);
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;}
  .brand-mark{display:grid;place-items:center;width:34px;height:34px;color:#fff;background:linear-gradient(135deg,var(--primary),#138a5b);border-radius:8px;}
  .nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;}
  .nav a{color:#657083;text-decoration:none;font-size:14px;font-weight:700;padding:8px 11px;border-radius:999px;}
  .nav a:hover,.nav a.active{color:var(--primary);background:#e8edff;}
  header{
    max-width:1180px;
    margin:0 auto;
    padding:36px 20px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
  }
  .page-brand{display:flex; align-items:center; gap:14px;}
  .page-mark{
    width:48px;height:48px;
    border-radius:12px;
    background:var(--orange-soft);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:18px;
    color:var(--orange);
    flex-shrink:0;
  }
  .brand-text .eyebrow{
    font-size:12px;
    font-weight:800;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--orange);
  }
  .brand-text h1{
    font-weight:800;
    font-size:28px;
    margin:2px 0 0;
    color:var(--ink);
  }
  .open-pill{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:700;
    color:var(--wa-green-dark);
    background:#eefdf3;
    border:1px solid #cdf3dc;
    padding:9px 16px;
    border-radius:100px;
  }
  .open-pill .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--wa-green);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:0.55; transform:scale(0.85);}
  }
  .controls{
    max-width:1180px;
    margin:8px auto 0;
    padding:0 20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
  }
  .search-box{position:relative; flex:1; min-width:220px;}
  .search-box input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    padding:12px 14px 12px 38px;
    border-radius:10px;
    font:inherit;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .search-box input:focus{border-color:var(--orange); box-shadow:0 0 0 3px var(--orange-soft);}
  .search-box::before{
    content:"Search";
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:11px; font-weight:800;
  }
  .sort-group{display:flex; gap:8px; font-size:13px; flex-wrap:wrap;}
  .sort-btn, .fuel-chip{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--muted);
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
    transition:all .15s;
  }
  .sort-btn:hover, .fuel-chip:hover{border-color:var(--orange); color:var(--orange);}
  .sort-btn.active, .fuel-chip.active{background:var(--orange-soft); border-color:var(--orange); color:var(--orange);}
  .grid{
    max-width:1180px;
    margin:22px auto 60px;
    padding:0 20px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:20px;
  }
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    opacity:0;
    transform:translateY(16px);
    animation:riseIn .55s ease forwards;
  }
  .card:hover{
    transform:translateY(-5px);
    box-shadow:0 14px 32px -18px rgba(28,31,38,0.25);
    border-color:#e2ded4;
  }
  @keyframes riseIn{to{opacity:1; transform:translateY(0);}}
  .card-media{position:relative;background:var(--panel);aspect-ratio:4/3;overflow:hidden;}
  .card-media img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
  .card:hover .card-media img{transform:scale(1.06);}
  .badge{
    position:absolute; top:10px; right:10px;
    background:rgba(255,255,255,0.92);
    border:1px solid var(--line);
    color:var(--ink);
    font-size:11px;
    font-weight:800;
    padding:5px 9px;
    border-radius:100px;
  }
  .card-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:9px;flex:1;}
  .card-body h3{font-weight:800;font-size:17px;margin:0;color:var(--ink);}
  .fuel-tag{align-self:flex-start;font-size:11px;font-weight:800;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:3px 9px;border-radius:6px;}
  .price-row{display:flex;align-items:baseline;gap:6px;margin-top:2px;}
  .price{font-size:21px;font-weight:800;color:var(--ink);}
  .price-unit{font-size:12px;color:var(--muted);}
  .book-btn{
    margin-top:auto;
    display:flex;align-items:center;justify-content:center;gap:8px;
    text-decoration:none;
    background:var(--wa-green);
    color:#fff;
    font-weight:800;
    font-size:13.5px;
    padding:11px 14px;
    border-radius:10px;
    transition:background .15s, transform .15s;
  }
  .book-btn:hover{background:var(--wa-green-dark);transform:translateY(-1px);}
  .footer{max-width:1180px;margin:0 auto 44px;padding:0 20px;text-align:center;color:var(--muted);font-size:13px;}
  .footer a{color:var(--orange);text-decoration:none;font-weight:800;}
  .empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);font-size:13.5px;}
  @media (max-width:700px){.topbar{align-items:flex-start;flex-direction:column;padding:13px 16px}.nav{justify-content:flex-start}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="brand-mark">C</div><span>Campus Help</span></div>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/lost-found.html">Lost &amp; Found</a>
    <a href="/cab.html" class="active">Campus Cab</a>
    <a href="/chat.html">College Chat</a>
  </nav>
</div>

<header>
  <div class="page-brand">
    <div class="page-mark">CC</div>
    <div class="brand-text">
      <div class="eyebrow">Campus Help Desk</div>
      <h1>Cab &amp; Car Service</h1>
    </div>
  </div>
  <div class="open-pill"><span class="dot"></span> Booking desk open - 24 hours</div>
</header>

<div class="controls">
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Search a car - e.g. Creta, Fronx, Brezza...">
  </div>
  <div class="sort-group">
    <button class="fuel-chip active" data-fuel="all">All Fuels</button>
    <button class="fuel-chip" data-fuel="petrol">Petrol</button>
    <button class="fuel-chip" data-fuel="diesel">Diesel</button>
    <button class="fuel-chip" data-fuel="cng">CNG</button>
    <button class="sort-btn active" data-sort="default">Default</button>
    <button class="sort-btn" data-sort="low">Price: Low to High</button>
    <button class="sort-btn" data-sort="high">Price: High to Low</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="footer">
  All bookings route to the campus desk on <a href="https://wa.me/919630741753" target="_blank" rel="noopener">+91 96307 41753</a> via WhatsApp
</div>

<script>
  const WA_NUMBER = "919630741753";

  const cars = [
    { name: "Ertiga", fuel: "Petrol", price: 2800, img: "/cab-assets/WhatsApp Image 2026-07-30 at 16.13.24.jpeg" },
    { name: "Punch Petrol", fuel: "Petrol", price: 3000, img: "/cab-assets/WhatsApp Image 2026-07-30 at 15.57.18.jpeg" },
    { name: "Creta Diesel", fuel: "Diesel", price: 4200, img: "/cab-assets/WhatsApp Image 2026-07-30 at 15.57.23.jpeg" },
    { name: "Creta Petrol", fuel: "Petrol", price: 4100, img: "/cab-assets/WhatsApp Image 2026-07-30 at 15.57.34.jpeg" },
    { name: "Exter CNG", fuel: "CNG", price: 3200, img: "/cab-assets/WhatsApp Image 2026-07-30 at 15.57.36.jpeg" },
    { name: "Baleno Delta Petrol+CNG", fuel: "Petrol+CNG", price: 3500, img: "/cab-assets/WhatsApp Image 2026-07-30 at 16.10.03.jpeg" },
    { name: "Fronx", fuel: "Petrol", price: 3550, img: "/cab-assets/WhatsApp Image 2026-07-30 at 15.57.23.jpeg" },
    { name: "Brezza LXI", fuel: "Petrol", price: 3100, img: "/cab-assets/WhatsApp Image 2026-07-30 at 16.10.03.jpeg" },
  ];

  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  const sortBtns = document.querySelectorAll('.sort-btn');
  const fuelChips = document.querySelectorAll('.fuel-chip');
  let currentSort = 'default';
  let currentFuel = 'all';

  function waLink(carName){
    const msg = encodeURIComponent(`Hi, I'd like to book the ${carName} (24 Hours) through the Campus Cab Desk.`);
    return `https://wa.me/${WA_NUMBER}?text=${msg}`;
  }

  function render(){
    const q = searchInput.value.trim().toLowerCase();
    let list = cars.filter(c => {
      const matchName = c.name.toLowerCase().includes(q);
      const matchFuel = currentFuel === 'all' || c.fuel.toLowerCase().includes(currentFuel);
      return matchName && matchFuel;
    });

    if(currentSort === 'low') list = list.slice().sort((a,b)=>a.price-b.price);
    if(currentSort === 'high') list = list.slice().sort((a,b)=>b.price-a.price);

    grid.innerHTML = '';

    if(list.length === 0){
      grid.innerHTML = `<div class="empty-state">No vehicle matches selected filters. Try adjusting your search.</div>`;
      return;
    }

    list.forEach((car, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (i * 0.05) + 's';
      card.innerHTML = `
        <div class="card-media">
          <img src="${car.img}" alt="${car.name}" loading="lazy">
          <div class="badge">24 Hrs</div>
        </div>
        <div class="card-body">
          <h3>${car.name}</h3>
          <span class="fuel-tag">${car.fuel}</span>
          <div class="price-row">
            <span class="price">₹${car.price.toLocaleString('en-IN')}</span>
            <span class="price-unit">/ 24 Hours</span>
          </div>
          <a class="book-btn" href="${waLink(car.name)}" target="_blank" rel="noopener">Book on WhatsApp</a>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  searchInput.addEventListener('input', render);
  sortBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      sortBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSort = btn.dataset.sort;
      render();
    });
  });

  fuelChips.forEach(chip => {
    chip.addEventListener('click', () => {
      fuelChips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFuel = chip.dataset.fuel;
      render();
    });
  });

  render();
</script>
</body>
</html>
