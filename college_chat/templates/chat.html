{% extends "base.html" %}

{% block title %}General Chat - College Chat{% endblock %}

{% block content %}
<style>
    .chat-messages {
        height: min(62vh, 520px);
        min-height: 380px;
        overflow-y: auto;
        padding: 22px;
        background:
            linear-gradient(180deg, rgba(248, 250, 252, 0.96), rgba(244, 247, 251, 0.96)),
            #f8fafc;
    }

    .message-row {
        width: fit-content;
        max-width: min(78%, 560px);
        margin-bottom: 13px;
        padding: 11px 13px;
        background: #fff;
        border: 1px solid #e4eaf2;
        border-radius: 8px;
        box-shadow: 0 8px 18px rgba(23, 32, 51, 0.06);
    }

    .message-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        font-size: 12px;
        color: var(--muted);
    }

    .message-author {
        color: var(--primary);
        font-weight: 800;
        font-size: 13px;
    }

    .message-text {
        color: var(--text);
        font-size: 15px;
        overflow-wrap: anywhere;
    }

    .message-form {
        display: flex;
        gap: 10px;
        padding: 16px;
        border-top: 1px solid var(--line);
        background: #fff;
    }

    .message-form input {
        flex: 1;
        margin-bottom: 0;
    }

    .message-form button {
        width: 110px;
        box-shadow: none;
    }

    @media (max-width: 640px) {
        .chat-messages {
            height: calc(100vh - 245px);
            min-height: 300px;
            padding: 16px;
        }

        .message-row {
            max-width: 100%;
        }

        .message-form {
            padding: 12px;
        }

        .message-form button {
            width: 86px;
        }
    }
</style>

<div class="app-shell">
    <div class="panel-header">
        <div>
            <div class="panel-title">General Room</div>
            <div class="panel-subtitle">Logged in as {{ user_name }}</div>
        </div>
        {% if role == 'admin' %}
            <div class="role-pill">Admin</div>
        {% endif %}
    </div>

    <div id="messages" class="chat-messages">
        {% for msg in messages %}
        <div class="message-row">
            <div class="message-meta">
                <span class="message-author">{{ msg.user_name }}</span>
                <span>{{ msg.created_at }}</span>
            </div>
            <div class="message-text">{{ msg.text }}</div>
        </div>
        {% endfor %}
    </div>

    <form id="message-form" class="message-form">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button type="submit">Send</button>
    </form>
</div>

<script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
<script>
    const socket = io();

    const messagesDiv = document.getElementById('messages');
    const form = document.getElementById('message-form');
    const input = document.getElementById('message-input');

    function scrollToBottom() {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    scrollToBottom();

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        socket.emit('send_message', { text: text });
        input.value = '';
    });

    socket.on('receive_message', function (msg) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message-row';
        msgDiv.innerHTML =
            '<div class="message-meta">' +
            '<span class="message-author">' + msg.user_name + '</span>' +
            '<span>' + msg.created_at + '</span>' +
            '</div>' +
            '<div class="message-text">' + msg.text + '</div>';
        messagesDiv.appendChild(msgDiv);
        scrollToBottom();
    });

    socket.on('connect_error', function () {
        alert('Could not connect to chat. Please log in again.');
        window.location.href = "{{ url_for('login_page') }}";
    });
</script>
{% endblock %}
